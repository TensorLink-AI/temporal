[tool.poetry]
name = "temporal"
version = "0.1.0"
description = "A library for temporal data analysis"
authors = ["Chris -- tensorlink-dev", "TensorLink-AI"]
maintainers = ["Chris chris@tensor-link.com"]
readme = "README.md"
license = "APACHE-2.0"

[tool.poetry.dependencies]
python = "^3.11"
torch = ">=2.3.1,<3.0.0"
transformers = ">=4.48.2,<5.0.0"
numpy = ">=2.2.4,<3.0.0"
scikit-learn = ">=1.6.1,<2.0.0"
joblib = ">=1.4.2,<2.0.0"
tqdm = ">=4.67.1,<5.0.0"
pyarrow = ">=19.0.1,<20.0.0"
datasets = ">=2.21.0,<3.0.0"
pandas = ">=2.2.3,<3.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
