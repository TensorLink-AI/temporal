name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          # Install runtime + dev dependencies (pytest lives in dev group)
          uv sync --all-groups
          # Extra safety: ensure pytest is present
          uv pip install pytest

      - name: Run tests
        run: uv run pytest -vv --disable-warnings
