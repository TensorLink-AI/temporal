name: Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          # Install all groups (runtime + dev)
          uv sync --all-groups
          # Extra safety: ensure coverage tools are present
          uv pip install coverage coverage-badge pytest

      - name: Run coverage
        run: |
          uv run coverage run -m pytest -vv --disable-warnings
          uv run coverage report -m
          uv run coverage-badge -o coverage.svg -f

      - name: Commit coverage badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: Update coverage badge"
          file_pattern: coverage.svg
